<path d="M268.0,115.0 H597.3 A4,4 0 0 1 601.3,119.0 V122.0 A4,4 0 0 1 597.3,126.0 H268.0 Z" fill="#d95926"/>
<text stroke="#2c3036" stroke-width="4" paint-order="stroke" x="607.3" y="124.5" font-size="11" fill="#b9bdc6" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">2.5</text>
<text x="32.0" y="149.0" font-size="12" fill="#d7dae0" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">zenv activate --auto .</text>
<text x="32.0" y="164.0" font-size="11" fill="#7f8590">what the shell hook runs on cd</text>
