<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426" role="img" aria-label="Mean time per command on a Mac and an HPC system: the shell hook's call to zenv takes 1.9 and 2.5 ms, close to an empty process; activating an environment with modules in a login shell takes 525 ms with zenv and 1,586 ms by hand, against 495 ms for the shell alone">
<title>Mean time per command on a Mac and an HPC system: the shell hook's call to zenv takes 1.9 and 2.5 ms, close to an empty process; activating an environment with modules in a login shell takes 525 ms with zenv and 1,586 ms by hand, against 495 ms for the shell alone</title>
<defs>
