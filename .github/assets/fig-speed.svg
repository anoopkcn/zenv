<rect x="16.0" y="220.0" width="728.0" height="190.0" rx="6" fill="#2c3036" stroke="#3a3e46"/>
<text x="32.0" y="248.0" font-size="12" fill="#b9bdc6" font-weight="600">Activating an environment with modules in a login shell, HPC system only</text>
<line x1="268.0" y1="262" x2="268.0" y2="380" stroke="#3a3e46" stroke-width="1"/>
<text x="268.0" y="396.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">0</text>
