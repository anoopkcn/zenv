<text x="534.7" y="190.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">2</text>
<line x1="668.0" y1="94" x2="668.0" y2="174" stroke="#3a3e46" stroke-width="1"/>
<text x="668.0" y="190.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">3 ms</text>
<text x="32.0" y="111.0" font-size="12" fill="#d7dae0" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">true</text>
<text x="32.0" y="126.0" font-size="11" fill="#7f8590">an empty process, for reference</text>
