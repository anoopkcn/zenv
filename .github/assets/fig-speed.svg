<text x="368.0" y="396.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">500</text>
<line x1="468.0" y1="262" x2="468.0" y2="380" stroke="#3a3e46" stroke-width="1"/>
<text x="468.0" y="396.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">1,000</text>
<line x1="568.0" y1="262" x2="568.0" y2="380" stroke="#3a3e46" stroke-width="1"/>
<text x="568.0" y="396.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">1,500</text>
<line x1="668.0" y1="262" x2="668.0" y2="380" stroke="#3a3e46" stroke-width="1"/>
<text x="668.0" y="396.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">2,000 ms</text>
<text x="32.0" y="279.0" font-size="12" fill="#d7dae0" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">bash -l</text>
<text x="32.0" y="294.0" font-size="11" fill="#7f8590">a login shell alone, for reference</text>
<path d="M268.0,276.5 H363.0 A4,4 0 0 1 367.0,280.5 V283.5 A4,4 0 0 1 363.0,287.5 H268.0 Z" fill="#d95926"/>
<text stroke="#2c3036" stroke-width="4" paint-order="stroke" x="373.0" y="286.0" font-size="11" fill="#b9bdc6" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">495</text>
<text x="32.0" y="317.0" font-size="12" fill="#d7dae0" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">source $(zenv activate &lt;env&gt;)</text>
<text x="32.0" y="332.0" font-size="11" fill="#7f8590">with the module cache</text>
<path d="M268.0,314.5 H369.0 A4,4 0 0 1 373.0,318.5 V321.5 A4,4 0 0 1 369.0,325.5 H268.0 Z" fill="#d95926"/>
<text stroke="#2c3036" stroke-width="4" paint-order="stroke" x="379.0" y="324.0" font-size="11" fill="#b9bdc6" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">525</text>
<text x="32.0" y="355.0" font-size="12" fill="#d7dae0" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">module load …</text>
<text x="32.0" y="370.0" font-size="11" fill="#7f8590">then source .venv/bin/activate, by hand</text>
<path d="M268.0,352.5 H581.2 A4,4 0 0 1 585.2,356.5 V359.5 A4,4 0 0 1 581.2,363.5 H268.0 Z" fill="#d95926"/>
