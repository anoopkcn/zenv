<text x="268.0" y="190.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">0</text>
<line x1="401.3" y1="94" x2="401.3" y2="174" stroke="#3a3e46" stroke-width="1"/>
<text x="401.3" y="190.0" font-size="11" fill="#7f8590" text-anchor="middle" font-family="ZedMono, 'SF Mono', Menlo, Consolas, monospace">1</text>
